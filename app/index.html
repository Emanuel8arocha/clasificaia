<!doctype html>
<!-- Página de ClasificaIA: formulario que llama a POST /predict con fetch. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClasificaIA - Calidad de Vinos</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      max-width: 420px; 
      margin: 2rem auto; 
      padding: 0 1rem;
    }
    label { 
      display: block; 
      margin-bottom: 0.6rem; 
    }
    input { 
      width: 100%; 
      padding: 6px; 
      box-sizing: border-box;
    }
    button { 
      padding: 8px 16px; 
      cursor: pointer;
      margin-top: 0.5rem;
    }
    #resultado { 
      font-weight: bold; 
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>ClasificaIA - Calidad de Vinos</h1>
  <p>Escribe las propiedades fisicoquímicas del vino y el modelo dirá su calidad.</p>

  <form id="formulario">
    <!-- name coincide EXACTAMENTE con los campos de la clase Vino en app/main.py -->
    <label>Acidez fija (g/dm³)
      <input name="acidez_fija" type="number" step="any" min="3" max="20" value="7.4" required>
    </label>
    <label>Acidez volátil (g/dm³)
      <input name="acidez_volatil" type="number" step="any" min="0" max="2.5" value="0.7" required>
    </label>
    <label>Ácido cítrico (g/dm³)
      <input name="acido_citrico" type="number" step="any" min="0" max="1.5" value="0.0" required>
    </label>
    <label>Azúcar residual (g/dm³)
      <input name="azucar_residual" type="number" step="any" min="0" max="30" value="1.9" required>
    </label>
    <label>Cloruros (g/dm³)
      <input name="cloruros" type="number" step="any" min="0" max="1" value="0.076" required>
    </label>
    <label>Dióxido de azufre libre (mg/dm³)
      <input name="dioxido_azufre_libre" type="number" step="any" min="0" max="100" value="11.0" required>
    </label>
    <label>Dióxido de azufre total (mg/dm³)
      <input name="dioxido_azufre_total" type="number" step="any" min="0" max="400" value="34.0" required>
    </label>
    <label>Densidad (g/cm³)
      <input name="densidad" type="number" step="any" min="0.98" max="1.01" value="0.9978" required>
    </label>
    <label>pH
      <input name="ph" type="number" step="any" min="2" max="5" value="3.51" required>
    </label>
    <label>Sulfatos (g/dm³)
      <input name="sulfatos" type="number" step="any" min="0" max="3" value="0.56" required>
    </label>
    <label>Alcohol (% vol)
      <input name="alcohol" type="number" step="any" min="5" max="20" value="9.4" required>
    </label>

    <!-- Hito 4: si la API exige llave, se escribe aquí (no se guarda en el código) -->
    <label>Llave de acceso (opcional)
      <input id="llave" type="password" autocomplete="off">
    </label>

    <button type="submit">Clasificar</button>
  </form>

  <p id="resultado"></p>

  <script>
    // Al enviar el formulario: arma un objeto JSON con los campos y llama a la API
    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault(); // no recargar la página

      const campos = new FormData(evento.target);
      const datos = {};
      for (const [nombre, valor] of campos) {
        datos[nombre] = parseFloat(valor);
      }

      const cabeceras = { "Content-Type": "application/json" };
      const llave = document.getElementById("llave").value;
      if (llave) {
        cabeceras["x-api-key"] = llave; // solo si el usuario la escribió
      }

      const resp = await fetch("/predict", {
        method: "POST",
        headers: cabeceras,
        body: JSON.stringify(datos),
      });

      const json = await resp.json();
      document.getElementById("resultado").textContent = resp.ok
        ? `${json.clase} (confianza ${(json.confianza * 100).toFixed(1)}%)`
        : "Datos inválidos: revisa los valores";
    });
  </script>
</body>
</html>
